name: docweave
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: docweave
      POSTGRES_USER: docweave
      POSTGRES_PASSWORD: docweave
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docweave"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build: .
    environment: &app-env
      DOCWEAVE_DATABASE_URL: postgres://docweave:docweave@postgres:5432/docweave?sslmode=disable
      DOCWEAVE_ROLE: api
      DOCWEAVE_ADDR: :8080
      DOCWEAVE_API_KEY: ${DOCWEAVE_API_KEY:-local-development}
      DOCWEAVE_USER_AGENT: DocWeave/1.0 (+https://github.com/bananatruck/docweave)
      DOCWEAVE_ALLOW_PRIVATE_NETWORKS: ${DOCWEAVE_ALLOW_PRIVATE_NETWORKS:-false}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DOCWEAVE_HTTP_PORT:-18080}:8080"
    restart: unless-stopped

  worker-1:
    build: .
    environment:
      <<: *app-env
      DOCWEAVE_ROLE: worker
      DOCWEAVE_ADDR: :9090
      DOCWEAVE_WORKERS: 2
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker-2:
    build: .
    environment:
      <<: *app-env
      DOCWEAVE_ROLE: worker
      DOCWEAVE_ADDR: :9090
      DOCWEAVE_WORKERS: 2
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=3d"]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${DOCWEAVE_PROMETHEUS_PORT:-9090}:9090"
    depends_on: [api, worker-1, worker-2]

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: docweave
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${DOCWEAVE_GRAFANA_PORT:-3000}:3000"
    depends_on: [prometheus]

  fixture:
    build: .
    entrypoint: ["/fixture"]
    environment:
      FIXTURE_ADDR: :8081
      FIXTURE_PAGES: 1000
      FIXTURE_VERSION: ${FIXTURE_VERSION:-v1}
    profiles: ["benchmark"]

volumes:
  postgres-data:
